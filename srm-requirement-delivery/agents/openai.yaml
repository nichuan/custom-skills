interface:
  display_name: "SRM 纯二开需求开发"
  short_description: "快速修改已有脚本或按需求号实现新二开"
  default_prompt: "使用 $srm-requirement-delivery 修改已有 Marmot 脚本；仅在实现新需求时按需求号读取猪齿鱼和平台模板。"
dependencies:
  tools:
    - type: "mcp"
      value: "zhenyun-pangu-mcp"
      description: "读取猪齿鱼、脚本身份候选、标准源码和必要数据库事实"
    - type: "mcp"
      value: "zhenyun-script-platform-mcp"
      description: "读取平台当前源码、远程调试并受控保存或部署"
policy:
  allow_implicit_invocation: true
