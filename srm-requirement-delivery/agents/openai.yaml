interface:
  display_name: "SRM 标准与纯二开需求交付"
  short_description: "交付标准业务、扩展点与 Marmot 脚本/资源需求"
  default_prompt: "使用 $srm-requirement-delivery 判定需求模式，并完成对应的标准源码或 Marmot 产物、验证与交付。"
dependencies:
  tools:
    - type: "mcp"
      value: "zhenyun-pangu-mcp"
      description: "读取猪齿鱼、定位标准源码、发现脚本身份并核实必要的数据库与日志事实"
    - type: "mcp"
      value: "zhenyun-script-platform-mcp"
      description: "读取平台当前源码与资源关系、远程调试，并受控创建、保存、绑定或部署"
policy:
  allow_implicit_invocation: true
